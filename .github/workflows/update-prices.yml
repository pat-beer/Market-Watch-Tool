name: update-prices

on:
  schedule:
    - cron: "10 0 * * 2-6"    # 07:10 เวลาไทย อังคาร-เสาร์ (ได้ราคาปิดสหรัฐฯ ของวันก่อน)
    - cron: "10 11 * * 1-5"   # 18:10 เวลาไทย จันทร์-ศุกร์
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_prices.py
      - name: Commit prices + series only (ไม่แตะ data/analysis.json)
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json data/series.json
          if ! git diff --staged --quiet; then
            git commit -m "prices $(date -u +'%Y-%m-%d %H:%M')Z"
            git pull --rebase
            git push
          fi
