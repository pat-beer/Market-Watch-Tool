<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Market">
<title>Market Structure Watchlist</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="vh" href="#main" data-th="ข้ามไปเนื้อหาหลัก" data-en="Skip to main content">ข้ามไปเนื้อหาหลัก</a>
<header class="top">
  <button class="back iconbtn" id="backBtn" hidden data-th-aria="ย้อนกลับ" data-en-aria="Back" aria-label="ย้อนกลับ">←</button>
  <div class="titlewrap">
    <h1 id="pageTitle">Market Structure</h1>
    <div class="sub" id="pageSub"></div>
  </div>
  <button class="iconbtn" id="langBtn" data-th-aria="สลับภาษาไทย/อังกฤษ" data-en-aria="Switch Thai/English" aria-label="สลับภาษาไทย/อังกฤษ">EN</button>
  <button class="iconbtn" id="fsBtn" data-th-aria="ปรับขนาดตัวอักษร" data-en-aria="Adjust text size" aria-label="ปรับขนาดตัวอักษร">Aa</button>
  <button class="iconbtn" id="themeBtn" data-th-aria="สลับธีมมืด/สว่าง" data-en-aria="Toggle dark/light theme" aria-label="สลับธีมมืด/สว่าง">☀️</button>
</header>
<main id="main"></main>
<nav class="nav" role="tablist">
  <button role="tab" id="tab-overview" aria-selected="true" data-tab="overview"><span class="ic">◎</span><span data-th="ภาพรวม" data-en="Overview">ภาพรวม</span></button>
  <button role="tab" id="tab-list" aria-selected="false" data-tab="list"><span class="ic">☰</span><span data-th="รายการ" data-en="Watchlist">รายการ</span></button>
  <button role="tab" id="tab-daily" aria-selected="false" data-tab="daily"><span class="ic">◷</span><span data-th="รายวัน" data-en="Daily">รายวัน</span></button>
  <button role="tab" id="tab-accum" aria-selected="false" data-tab="accum"><span class="ic">✚</span><span data-th="สะสม" data-en="Accumulate">สะสม</span></button>
</nav>
<div class="sheet" id="sheet" hidden><div class="pane" id="pane" role="dialog" aria-modal="true"></div></div>

<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
